<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado lineal a 120 grados -->
    <linearGradient id="mantia-bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(120 0.5 0.5)">
      <stop offset="0%" stop-color="#063B38" />
      <stop offset="42%" stop-color="#075E55" />
      <stop offset="72%" stop-color="#078F7B" />
      <stop offset="100%" stop-color="#10BFA5" />
    </linearGradient>
  </defs>

  <!-- Fondo con el degradado personalizado -->
  <rect width="512" height="512" fill="url(#mantia-bg-gradient)" rx="96" />

  <!-- Logo Isotipo "A" de MANTIA en blanco puro -->
  <g fill="#FFFFFF">
    <!-- Estructura principal en V invertida -->
    <path d="M 256 110 L 396 390 L 342 390 L 256 220 L 170 390 L 116 390 Z" />
    
    <!-- Travesaño inferior trapezoidal -->
    <polygon points="210,325 302,325 320,365 192,365" />
  </g>
</svg>
